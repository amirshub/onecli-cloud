name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node
          # Use the workflow GITHUB_TOKEN. Upstream uses ONECLI_OSS_RELEASE for a
          # bot PAT; that secret on this fork is invalid and causes Bad credentials.
          token: ${{ github.token }}
